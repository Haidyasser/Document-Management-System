spring:
  application:
    name: Document Management System

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/dms_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    mongodb:
      uri: mongodb+srv://${DB_USERNAME}:${DB_PASSWORD}@cluster0.a4w6mlg.mongodb.net/dms=Cluster0

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB


server:
  port: 8080


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000